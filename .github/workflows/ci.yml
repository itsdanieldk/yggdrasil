name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository: the deploy reaches Vercel with its own token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Test
        run: >
          dotnet test tests/Yggdrasil.Tests/Yggdrasil.Tests.fsproj
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore

  generate:
    name: generate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: .bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Yggdrasil.Generate/Assets.fs') }}

      - name: Generate site
        run: dotnet run --project src/Yggdrasil.Generate

      - name: Check the output
        shell: bash
        run: bash scripts/check-dist.sh dist

  deploy:
    needs: [test, generate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    # Upload and promote are separate steps, so two quick pushes could otherwise promote the older build
    # last. Queued runs wait, and a newer pending run supersedes an older one.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: .bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Yggdrasil.Generate/Assets.fs') }}

      # Pinned, because it runs with the production token: a new release is adopted by editing this line, not by
      # whatever npm serves on the next push.
      - name: Install the Vercel CLI
        run: npm install --global vercel@61.0.0

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # vercel build generates the site afresh, so the generate job's checks say nothing about these files.
      - name: Check the output
        run: bash scripts/check-dist.sh .vercel/output/static

      # --skip-domain keeps the production domain on the previous deployment until the smoke test passes;
      # without it the alias moves first and a broken build is live before anything checks it.
      - name: Deploy (not yet live)
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --skip-domain --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "staged at $url"

      - name: Smoke-test the deployment
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          fail() { echo "::error::$1"; exit 1; }

          [ -n "${VERCEL_BYPASS:-}" ] || fail "VERCEL_AUTOMATION_BYPASS_SECRET is not set — enable Protection Bypass for Automation in Vercel and add the secret to the repo"
          bypass=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS")

          # The HTTP status of $url$1, saving the body to $2 when one is given.
          status() { curl -sS -o "${2:-/dev/null}" -w '%{http_code}' "${bypass[@]}" "$url$1"; }

          code=$(status /)
          [ "$code" = "200" ] || fail "home page returned HTTP $code"

          headers=$(curl -sSI "${bypass[@]}" "$url/")
          for header in content-security-policy strict-transport-security x-content-type-options; do
            grep -iq "^$header:" <<< "$headers" || fail "$header missing — the vercel.json translation dropped it"
          done

          code=$(status /about)
          [ "$code" = "200" ] || fail "/about returned HTTP $code — the directory index did not resolve"

          feed="$RUNNER_TEMP/rss.xml"
          code=$(status /rss.xml "$feed")
          [ "$code" = "200" ] || fail "/rss.xml returned HTTP $code"

          # An article, taken from the feed so the check follows the content rather than naming a note.
          article=$(python3 -c 'import sys, urllib.parse, xml.etree.ElementTree as E; print(urllib.parse.urlparse(E.parse(sys.argv[1]).find("channel/item/link").text).path)' "$feed") \
            || fail "/rss.xml has no item to request"
          code=$(status "$article")
          [ "$code" = "200" ] || fail "$article, the first feed item, returned HTTP $code"

          css="$RUNNER_TEMP/app.css"
          code=$(status /assets/css/app.css "$css")
          [ "$code" = "200" ] && [ -s "$css" ] || fail "/assets/css/app.css returned HTTP $code or an empty body"

          code=$(status /_vercel/insights/script.js)
          [ "$code" = "200" ] || fail "/_vercel/insights/script.js returned HTTP $code — is Web Analytics enabled for the project?"

          missing="$RUNNER_TEMP/missing.html"
          code=$(status /this-page-does-not-exist "$missing")
          [ "$code" = "404" ] || fail "a missing page returned HTTP $code instead of 404"
          grep -q "Page Not Found" "$missing" || fail "a missing page was not served the site's 404.html"

          echo "ok: staged deployment serves pages, an article, the feed, CSS, analytics and the 404 page, with security headers intact"

      - name: Promote to production
        run: vercel promote "${{ steps.deploy.outputs.url }}" --yes --token=${{ secrets.VERCEL_TOKEN }}

      # The custom domain is public, so no bypass header. The deployment already passed the smoke test, so
      # a failure here means the alias swap itself went wrong.
      - name: Check the live domain
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          for path in / /about; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://itsdaniel.dk$path")
            [ "$code" = "200" ] || fail "https://itsdaniel.dk$path returned HTTP $code after promotion"
          done

          echo "ok: itsdaniel.dk serves home and /about"
